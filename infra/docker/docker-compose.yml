services:
  upload-service:
    build:
      context: ../../backend/upload-service

    container_name: upload-service

    ports:
      - "3000:3000"

    env_file:
      - ../../backend/upload-service/.env

    environment:
      DATABASE_URL: postgresql://admin:password@postgres:5432/video_platform

  nginx:
    image: nginx:latest

    container_name: nginx

    ports:
      - "80:80"

    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf

    depends_on:
      - upload-service

  transcoder-worker:
    build:
      context: ../../workers/transcoder-worker

    container_name: transcoder-worker

    env_file:
      - ../../workers/transcoder-worker/.env
    environment:
      DATABASE_URL: postgresql://admin:password@postgres:5432/video_platform

  postgres:
    image: postgres:16

    container_name: postgres

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: video_platform

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: