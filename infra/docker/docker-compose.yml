services:
  upload-service:
    build:
      context: ../../backend/upload-service

    container_name: upload-service

    ports:
      - "3000:3000"

    env_file:
      - ../../backend/upload-service/.env

    environment:
      DATABASE_URL: postgresql://admin:password@postgres:5432/video_platform

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "http://localhost:3000/health"
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:latest

    container_name: nginx

    ports:
      - "80:80"

    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf

    depends_on:
      - upload-service

  transcoder-worker:
    build:
      context: ../../workers/transcoder-worker

    env_file:
      - ../../workers/transcoder-worker/.env
    environment:
      DATABASE_URL: postgresql://admin:password@postgres:5432/video_platform
      API_URL: http://upload-service:3000
    deploy:
      replicas: 1

  postgres:
    image: postgres:16

    container_name: postgres

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: video_platform

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

    container_name: redis

    ports:
      - "6379:6379"

volumes:
  postgres_data: