version: "3.9"

services:
  upload-service:
    build:
      context: ../../backend/upload-service

    container_name: upload-service

    ports:
      - "3000:3000"

    env_file:
      - ../../backend/upload-service/.env

  nginx:
    image: nginx:latest

    container_name: nginx

    ports:
      - "80:80"

    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf

    depends_on:
      - upload-service

  transcoder-worker:
    build:
      context: ../../workers/transcoder-worker

    container_name: transcoder-worker

    env_file:
      - ../../workers/transcoder-worker/.env
