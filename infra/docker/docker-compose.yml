services:
  upload-service:
    build:
      context: ../../backend/upload-service

    container_name: upload-service

    ports:
      - "3000:3000"

    env_file:
      - .env

    volumes:
      - ../../infra/keys/cloudfront-private.pem:/app/keys/cloudfront-private.pem:ro

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "http://localhost:3000/health"
        ]
      interval: 60s
      timeout: 10s
      retries: 3

    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ../../frontend/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WEBSOCKET_URL: ${NEXT_PUBLIC_WEBSOCKET_URL}
        NEXT_PUBLIC_CLOUDFRONT_DOMAIN: ${NEXT_PUBLIC_CLOUDFRONT_DOMAIN}

    container_name: frontend

    ports:
      - "3001:3001"

    environment:
      PORT: 3001

    depends_on:
      - upload-service

  nginx:
    image: nginx:latest

    container_name: nginx

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro

    depends_on:
      - upload-service
      - frontend

  transcoder-worker:
    build:
      context: ../../workers/transcoder-worker

    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      API_URL: http://upload-service:3000
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    deploy:
      replicas: 1

    depends_on:
      - postgres

  postgres:
    image: postgres:16

    container_name: postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

    container_name: redis

    command: redis-server --requirepass ${REDIS_PASSWORD}

    ports:
      - "6379:6379"

volumes:
  postgres_data: