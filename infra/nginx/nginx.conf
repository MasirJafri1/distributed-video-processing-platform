events {
    worker_connections 1024;
}

http {
    # --- Rate limiting zone ---
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;

    # --- Redirect all HTTP to HTTPS ---
    server {
        listen 80;
        server_name video-processing-api.masir-projects.me video-processing.masir-projects.me;

        # Certbot ACME challenge (used for SSL cert issuance/renewal)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --- Backend API: video-processing-api.masir-projects.me ---
    server {
        listen 443 ssl;
        server_name video-processing-api.masir-projects.me;

        ssl_certificate     /etc/letsencrypt/live/video-processing-api.masir-projects.me/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/video-processing-api.masir-projects.me/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy no-referrer;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location / {
            limit_req zone=general burst=20 nodelay;

            proxy_pass http://upload-service:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # --- Frontend: video-processing.masir-projects.me ---
    server {
        listen 443 ssl;
        server_name video-processing.masir-projects.me;

        ssl_certificate     /etc/letsencrypt/live/video-processing-api.masir-projects.me/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/video-processing-api.masir-projects.me/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy no-referrer;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location / {
            proxy_pass http://frontend:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # --- Fallback: plain HTTP for direct IP access (health checks, etc.) ---
    server {
        listen 80 default_server;
        server_name _;

        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy no-referrer;

        location / {
            proxy_pass http://upload-service:3000;
        }
    }
}